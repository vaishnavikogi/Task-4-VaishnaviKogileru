<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#6C63FF" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#202124" flood-opacity="0.14"/>
    </filter>
    <clipPath id="win"><rect x="50" y="50" width="400" height="330" rx="22"/></clipPath>
  </defs>

  <!-- Soft background glow -->
  <circle cx="300" cy="215" r="190" fill="#8B7CFF" opacity="0.10"/>
  <circle cx="470" cy="100" r="70" fill="#6C63FF" opacity="0.10"/>

  <!-- App window -->
  <g filter="url(#shadow)">
    <rect x="50" y="50" width="400" height="330" rx="22" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="50" y="50" width="78" height="330" fill="#F5F4FF"/>
    <rect x="50" y="50" width="400" height="38" fill="#FFFFFF"/>
    <rect x="50" y="87" width="400" height="1" fill="#ECEEF5"/>
  </g>
  <circle cx="72" cy="69" r="5" fill="#FCA5A5"/>
  <circle cx="90" cy="69" r="5" fill="#FDE68A"/>
  <circle cx="108" cy="69" r="5" fill="#86EFAC"/>

  <!-- Sidebar -->
  <rect x="64" y="108" width="50" height="26" rx="8" fill="#6C63FF"/>
  <circle cx="79" cy="121" r="5" fill="#fff"/>
  <rect x="89" y="118" width="17" height="6" rx="3" fill="#fff" opacity="0.8"/>
  <rect x="64" y="146" width="50" height="26" rx="8" fill="#E4E2FF"/>
  <rect x="64" y="184" width="50" height="26" rx="8" fill="#E4E2FF"/>
  <rect x="64" y="222" width="50" height="26" rx="8" fill="#E4E2FF"/>

  <!-- Greeting -->
  <rect x="144" y="104" width="112" height="11" rx="5.5" fill="#202124"/>
  <rect x="144" y="123" width="172" height="7" rx="3.5" fill="#E5E7EB"/>

  <!-- Progress ring card -->
  <rect x="144" y="146" width="130" height="116" rx="14" fill="#F7F8FC"/>
  <circle cx="209" cy="200" r="32" fill="none" stroke="#E4E2FF" stroke-width="9"/>
  <circle cx="209" cy="200" r="32" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="150.8 201" transform="rotate(-90 209 200)"/>
  <text x="209" y="205" text-anchor="middle" font-size="15" font-weight="800" fill="#202124">75%</text>
  <text x="209" y="250" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6B7280">Today's progress</text>

  <!-- Bar chart card -->
  <rect x="286" y="146" width="150" height="116" rx="14" fill="#F7F8FC"/>
  <text x="300" y="166" font-size="9.5" font-weight="600" fill="#6B7280">Study hours</text>
  <g>
    <rect x="300" y="222" width="12" height="28" rx="4" fill="#E4E2FF"/>
    <rect x="318" y="206" width="12" height="44" rx="4" fill="#E4E2FF"/>
    <rect x="336" y="216" width="12" height="34" rx="4" fill="#E4E2FF"/>
    <rect x="354" y="194" width="12" height="56" rx="4" fill="#E4E2FF"/>
    <rect x="372" y="208" width="12" height="42" rx="4" fill="#E4E2FF"/>
    <rect x="390" y="182" width="12" height="68" rx="4" fill="url(#bar)"/>
    <rect x="408" y="200" width="12" height="50" rx="4" fill="#E4E2FF"/>
  </g>

  <!-- Task rows -->
  <g>
    <rect x="144" y="274" width="292" height="26" rx="9" fill="#fff" stroke="#ECEEF5"/>
    <circle cx="159" cy="287" r="7" fill="#22C55E"/>
    <path d="M155.5 287l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="173" y="284" width="120" height="6" rx="3" fill="#CBD0DC"/>
    <rect x="384" y="281" width="40" height="12" rx="6" fill="#DCFCE7"/>

    <rect x="144" y="306" width="292" height="26" rx="9" fill="#fff" stroke="#ECEEF5"/>
    <circle cx="159" cy="319" r="7" fill="#22C55E"/>
    <path d="M155.5 319l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="173" y="316" width="92" height="6" rx="3" fill="#CBD0DC"/>
    <rect x="384" y="313" width="40" height="12" rx="6" fill="#DCFCE7"/>

    <rect x="144" y="338" width="292" height="26" rx="9" fill="#fff" stroke="#ECEEF5"/>
    <circle cx="159" cy="351" r="6.5" fill="none" stroke="#C7C9D9" stroke-width="1.8"/>
    <rect x="173" y="348" width="142" height="6" rx="3" fill="#202124" opacity="0.75"/>
    <rect x="384" y="345" width="40" height="12" rx="6" fill="#EDEBFF"/>
  </g>

  <!-- Floating timer card -->
  <g filter="url(#soft)">
    <rect x="368" y="14" width="158" height="74" rx="16" fill="#fff"/>
  </g>
  <circle cx="400" cy="51" r="17" fill="none" stroke="#E4E2FF" stroke-width="5"/>
  <circle cx="400" cy="51" r="17" fill="none" stroke="#6C63FF" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="64 107" transform="rotate(-90 400 51)"/>
  <text x="428" y="50" font-size="19" font-weight="800" fill="#202124">24:35</text>
  <text x="428" y="67" font-size="10" font-weight="600" fill="#6B7280">Focus session</text>

  <!-- Floating streak card -->
  <g filter="url(#soft)">
    <rect x="10" y="322" width="156" height="68" rx="16" fill="#fff"/>
  </g>
  <circle cx="42" cy="356" r="17" fill="#FEF3C7"/>
  <path d="M42 345c1 4 6 6 6 11a6 6 0 0 1-12 0c0-2.4 1.2-3.8 2.4-4.8.2 2.4 1.2 3.6 2.4 3.6-.6-3.6-.6-6.2 1.2-9.8z" fill="#F59E0B"/>
  <text x="68" y="353" font-size="13" font-weight="800" fill="#202124">7 day streak</text>
  <text x="68" y="369" font-size="10" font-weight="600" fill="#6B7280">Keep it going!</text>

  <!-- Floating "task done" badge -->
  <g filter="url(#soft)">
    <circle cx="478" cy="318" r="28" fill="#22C55E"/>
  </g>
  <path d="M466 318l9 9 16-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
